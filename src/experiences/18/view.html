<canvas
  id="culture-spectrum"
  tabindex="0"
  role="application"
  aria-label="Exploración táctil de la cultura, desde el conocimiento compartido en la parte inferior hasta la civilización planetaria en la parte superior. Toca, arrastra o usa las flechas del teclado."
></canvas>
<div id="top-bloom" aria-hidden="true"></div>
<div id="bottom-glow" aria-hidden="true"></div>
<div id="light-field" aria-hidden="true"></div>
<div id="scan-line" aria-hidden="true"></div>
<div id="grain" aria-hidden="true"></div>
<div id="vignette" aria-hidden="true"></div>
<div id="hint" aria-hidden="true">
  <strong>Toca y asciende</strong> · del conocimiento a la civilización
</div>
<div id="readout" aria-live="polite" aria-atomic="true">
  <span id="evidence-class" data-narration-role="shared-context"></span
  ><strong id="zone-name" data-narration-role="region-heading"></strong
  ><span id="feature-name" data-narration-role="item"></span
  ><span id="metric" data-narration-role="shared-context"></span
  ><span id="fact" data-narration-role="explanation"></span>
</div>
<div id="touch-orb" aria-hidden="true"></div>
<div id="journey-scale" aria-hidden="true">
  <span id="scale-top">Civilización planetaria</span>
  <div id="scale-track"><div id="scale-fill"></div></div>
  <div id="scale-dot"></div>
  <span id="scale-value">Conocimiento compartido</span
  ><span id="scale-bottom">Conocimiento compartido</span>
</div>

<!--
    Visualización educativa conceptual, táctil y sin dependencias externas.

    La escala vertical representa aumento de alcance, acumulación y coordinación cultural, no una escalera
    universal de superioridad. Las sociedades pueden resolver problemas semejantes de formas distintas;
    agricultura, escritura, ciudades, industria y conectividad no forman una trayectoria única, obligatoria
    ni irreversible. Las regiones se superponen y las prácticas antiguas continúan dentro de sistemas modernos.

    No se afirma que sociedades sin escritura carezcan de conocimiento complejo, que la agricultura mejorara
    inmediatamente toda vida, que instituciones sirvan por igual a todas las personas, que tecnología determine
    por sí sola el cambio social ni que la conectividad global haya eliminado la diversidad cultural.

    "Civilización planetaria" describe una red de sociedades interdependientes capaz de transformar sistemas
    terrestres. No implica unidad política, acceso igual, coordinación completa ni una definición universal de
    civilización. Los elementos visuales son metáforas interactivas, no reconstrucciones históricas literales.
  -->
