<canvas
  id="futures-spectrum"
  tabindex="0"
  role="application"
  aria-label="Exploración táctil de los futuros de la civilización, desde los futuros tecnológicos en la parte inferior hasta el horizonte desconocido en la parte superior. Toca, arrastra o usa las flechas del teclado."
></canvas>
<div id="top-bloom" aria-hidden="true"></div>
<div id="bottom-glow" aria-hidden="true"></div>
<div id="light-field" aria-hidden="true"></div>
<div id="scan-line" aria-hidden="true"></div>
<div id="grain" aria-hidden="true"></div>
<div id="vignette" aria-hidden="true"></div>
<div id="hint" aria-hidden="true">
  <strong>Toca y asciende</strong> · del presente planetario al destino cósmico
</div>
<div id="readout" aria-live="polite" aria-atomic="true">
  <span id="evidence-class"></span><strong id="zone-name"></strong
  ><span id="feature-name"></span><span id="metric"></span
  ><span id="fact"></span>
</div>
<div id="touch-orb" aria-hidden="true"></div>
<div id="journey-scale" aria-hidden="true">
  <span id="scale-top">Horizonte desconocido</span>
  <div id="scale-track"><div id="scale-fill"></div></div>
  <div id="scale-dot"></div>
  <span id="scale-value">Futuros tecnológicos</span
  ><span id="scale-bottom">Futuros tecnológicos</span>
</div>

<!--
    Visualización educativa conceptual, táctil y sin dependencias externas.

    La escala vertical representa escenarios y capacidades posibles, no una cronología inevitable ni una
    predicción. Los niveles cercanos al presente combinan tecnologías existentes con transiciones todavía
    incompletas; los niveles superiores son progresivamente más hipotéticos. Cada capacidad puede producir
    resultados distintos según valores, propiedad, distribución, instituciones, cooperación y accidentes.

    La aplicación distingue posibilidad física, viabilidad técnica, legitimidad política y deseabilidad social.
    No afirma que la inteligencia implique conciencia, que la expansión espacial sea inevitable, que una mayor
    escala energética equivalga a progreso moral ni que la humanidad tenga derecho automático a transformar
    otros mundos. Las escenas son metáforas interactivas, no reconstrucciones ni predicciones literales.
  -->
