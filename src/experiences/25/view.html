<canvas
  id="final-horizon-spectrum"
  tabindex="0"
  role="application"
  aria-label="Exploración táctil del horizonte final, desde una sola historia incompleta en la parte inferior hasta los límites de observación y existencia en la parte superior. La posición horizontal cambia entre alternativas, transformaciones y límites. Toca, arrastra o usa las flechas del teclado."
></canvas>
<div id="top-bloom" aria-hidden="true"></div>
<div id="bottom-glow" aria-hidden="true"></div>
<div id="light-field" aria-hidden="true"></div>
<div id="scan-line" aria-hidden="true"></div>
<div id="grain" aria-hidden="true"></div>
<div id="vignette" aria-hidden="true"></div>
<div id="hint" aria-hidden="true">
  <strong>Toca y asciende</strong> · del propósito a los límites de la
  existencia
</div>
<div id="readout" aria-live="polite" aria-atomic="true">
  <span id="evidence-class"></span><strong id="zone-name"></strong
  ><span id="feature-name"></span><span id="metric"></span
  ><span id="fact"></span>
</div>
<div id="touch-orb" aria-hidden="true"></div>
<div id="journey-scale" aria-hidden="true">
  <span id="scale-top">Horizonte final</span>
  <div id="scale-track"><div id="scale-fill"></div></div>
  <div id="scale-dot"></div>
  <span id="scale-value">Una sola historia incompleta</span
  ><span id="scale-bottom">Historia incompleta</span>
</div>

<!--
    Visualización educativa conceptual, táctil y sin dependencias externas.

    La escala vertical representa una distancia creciente respecto de la existencia humana actual:
    futuro elegido, transformación biológica y mental, postbiología, civilización galáctica,
    realidad construida, límites cognitivos, horizontes cosmológicos, universo tardío y frontera final.

    La dimensión horizontal contrasta alternativas abiertas: continuidad o transformación,
    identidad individual o copiada, realidad física o construida, expansión o conservación,
    supervivencia o conclusión, legado duradero o impermanencia significativa y explicación última
    o incertidumbre permanente.

    Ninguna escena promete trascendencia. Las posibilidades especulativas se muestran como tales;
    los límites físicos, lógicos y observacionales permanecen visibles incluso para civilizaciones extremas.
  -->
