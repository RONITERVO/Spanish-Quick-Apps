<canvas
  id="cosmic-life-spectrum"
  tabindex="0"
  role="application"
  aria-label="Exploración táctil de la vida cósmica, desde el horizonte desconocido en la parte inferior hasta las formas de vida no clasificadas en la parte superior. Toca, arrastra o usa las flechas del teclado."
></canvas>
<div id="top-bloom" aria-hidden="true"></div>
<div id="bottom-glow" aria-hidden="true"></div>
<div id="light-field" aria-hidden="true"></div>
<div id="scan-line" aria-hidden="true"></div>
<div id="grain" aria-hidden="true"></div>
<div id="vignette" aria-hidden="true"></div>
<div id="hint" aria-hidden="true">
  <strong>Toca y asciende</strong> · del horizonte desconocido a la vida cósmica
</div>
<div id="readout" aria-live="polite" aria-atomic="true">
  <span id="evidence-class" data-narration-role="shared-context"></span
  ><strong id="zone-name" data-narration-role="region-heading"></strong
  ><span id="feature-name" data-narration-role="item"></span
  ><span id="metric" data-narration-role="shared-context"></span
  ><span id="fact" data-narration-role="explanation"></span>
</div>
<div id="touch-orb" aria-hidden="true"></div>
<div id="journey-scale" aria-hidden="true">
  <span id="scale-top">Vida cósmica desconocida</span>
  <div id="scale-track"><div id="scale-fill"></div></div>
  <div id="scale-dot"></div>
  <span id="scale-value">Horizonte desconocido</span
  ><span id="scale-bottom">Horizonte desconocido</span>
</div>

<!--
    Visualización educativa conceptual, táctil y sin dependencias externas.

    La escala vertical representa una búsqueda cada vez más amplia: condiciones astronómicas y químicas,
    habitabilidad, posibles biosferas, evidencia indirecta, inteligencia y contacto. No es una escalera
    evolutiva ni afirma que la vida, la complejidad o la tecnología sean inevitables. La dimensión horizontal
    muestra ambientes, mecanismos e interpretaciones alternativas.

    La aplicación distingue ingredientes, habitabilidad, vida, biofirmas y tecnofirmas. También distingue
    observación, inferencia e hipótesis. Ninguna escena representa una detección confirmada de vida o
    inteligencia extraterrestre. Las imágenes son metáforas científicas y no retratos de mundos conocidos.
  -->
