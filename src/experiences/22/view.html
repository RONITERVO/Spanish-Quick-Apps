<canvas
  id="cosmic-contact-spectrum"
  tabindex="0"
  role="application"
  aria-label="Exploración táctil del contacto cósmico, desde una señal sin explicación definitiva en la parte inferior hasta la coexistencia incierta entre civilizaciones en la parte superior. Toca, arrastra o usa las flechas del teclado."
></canvas>
<div id="top-bloom" aria-hidden="true"></div>
<div id="bottom-glow" aria-hidden="true"></div>
<div id="light-field" aria-hidden="true"></div>
<div id="scan-line" aria-hidden="true"></div>
<div id="grain" aria-hidden="true"></div>
<div id="vignette" aria-hidden="true"></div>
<div id="hint" aria-hidden="true">
  <strong>Toca y asciende</strong> · de la primera señal a una relación incierta
</div>
<div id="readout" aria-live="polite" aria-atomic="true">
  <span id="evidence-class" data-narration-role="shared-context"></span
  ><strong id="zone-name" data-narration-role="region-heading"></strong
  ><span id="feature-name" data-narration-role="item"></span
  ><span id="metric" data-narration-role="shared-context"></span
  ><span id="fact" data-narration-role="explanation"></span>
</div>
<div id="touch-orb" aria-hidden="true"></div>
<div id="journey-scale" aria-hidden="true">
  <span id="scale-top">Coexistencia incierta</span>
  <div id="scale-track"><div id="scale-fill"></div></div>
  <div id="scale-dot"></div>
  <span id="scale-value">Una señal sin explicación definitiva</span
  ><span id="scale-bottom">Señal sin explicación</span>
</div>

<!--
    Visualización educativa conceptual, táctil y sin dependencias externas.

    La escala vertical representa una profundidad creciente de contacto: detección, verificación,
    interpretación, respuesta, intercambio y relación. No representa una cronología inevitable.
    La dimensión horizontal presenta explicaciones, decisiones y lecturas rivales: natural o
    artificial, público o confidencial, silencio o respuesta, cooperación o cautela.

    La aplicación evita la secuencia ficticia «señal → traducción instantánea → amistad alienígena».
    Distingue anomalía, evidencia, tecnofirma, mensaje, comprensión e intención. Sus escenas son
    metáforas educativas: no afirman que exista una detección confirmada ni una autoridad planetaria única.
  -->
