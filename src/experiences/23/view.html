<canvas
  id="cosmic-perspectives-spectrum"
  tabindex="0"
  role="application"
  aria-label="Exploración táctil de perspectivas cósmicas, desde otra perspectiva sobre la realidad en la parte inferior hasta una perspectiva cósmica plural en la parte superior. La posición horizontal cambia el marco cognitivo. Toca, arrastra o usa las flechas del teclado."
></canvas>
<div id="top-bloom" aria-hidden="true"></div>
<div id="bottom-glow" aria-hidden="true"></div>
<div id="light-field" aria-hidden="true"></div>
<div id="scan-line" aria-hidden="true"></div>
<div id="grain" aria-hidden="true"></div>
<div id="vignette" aria-hidden="true"></div>
<div id="hint" aria-hidden="true">
  <strong>Toca y asciende</strong> · de una visión humana a muchas formas de
  comprender
</div>
<div id="readout" aria-live="polite" aria-atomic="true">
  <span id="evidence-class" data-narration-role="shared-context"></span
  ><strong id="zone-name" data-narration-role="region-heading"></strong
  ><span id="feature-name" data-narration-role="item"></span
  ><span id="metric" data-narration-role="shared-context"></span
  ><span id="fact" data-narration-role="explanation"></span>
</div>
<div id="touch-orb" aria-hidden="true"></div>
<div id="journey-scale" aria-hidden="true">
  <span id="scale-top">Perspectiva plural</span>
  <div id="scale-track"><div id="scale-fill"></div></div>
  <div id="scale-dot"></div>
  <span id="scale-value">Otra perspectiva sobre la realidad</span
  ><span id="scale-bottom">Otra perspectiva</span>
</div>

<!--
    Visualización educativa conceptual, táctil y sin dependencias externas.

    La escala vertical representa una ampliación de perspectiva: mente humana, mente alienígena,
    conceptos alternativos, modelos comparados y perspectiva plural. No representa una jerarquía
    en la que una inteligencia superior sustituye a otra. La dimensión horizontal contrasta marcos:
    identidad individual o colectiva, tiempo lineal o cíclico, realidad de objetos o de procesos,
    cognición biológica o artificial, acuerdo empírico o desacuerdo fundamental.

    La aplicación evita tanto el antropocentrismo como el relativismo. Diferentes perspectivas pueden
    producir modelos distintos, pero las observaciones, predicciones y pruebas siguen limitando qué
    afirmaciones funcionan. Sus escenas son metáforas educativas sobre posibilidades, no descripciones
    confirmadas de civilizaciones extraterrestres.
  -->
