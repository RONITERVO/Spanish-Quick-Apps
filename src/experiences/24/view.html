<canvas
  id="cosmic-meaning-spectrum"
  tabindex="0"
  role="application"
  aria-label="Exploración táctil del significado cósmico, desde una perspectiva cósmica plural en la parte inferior hasta el horizonte final en la parte superior. La posición horizontal cambia la interpretación del valor y el propósito. Toca, arrastra o usa las flechas del teclado."
></canvas>
<div id="top-bloom" aria-hidden="true"></div>
<div id="bottom-glow" aria-hidden="true"></div>
<div id="light-field" aria-hidden="true"></div>
<div id="scan-line" aria-hidden="true"></div>
<div id="grain" aria-hidden="true"></div>
<div id="vignette" aria-hidden="true"></div>
<div id="hint" aria-hidden="true">
  <strong>Toca y asciende</strong> · de la realidad indiferente al propósito
  construido
</div>
<div id="readout" aria-live="polite" aria-atomic="true">
  <span id="evidence-class" data-narration-role="shared-context"></span
  ><strong id="zone-name" data-narration-role="region-heading"></strong
  ><span id="feature-name" data-narration-role="item"></span
  ><span id="metric" data-narration-role="shared-context"></span
  ><span id="fact" data-narration-role="explanation"></span>
</div>
<div id="touch-orb" aria-hidden="true"></div>
<div id="journey-scale" aria-hidden="true">
  <span id="scale-top">Horizonte final</span>
  <div id="scale-track"><div id="scale-fill"></div></div>
  <div id="scale-dot"></div>
  <span id="scale-value">Perspectiva cósmica plural</span
  ><span id="scale-bottom">Perspectiva plural</span>
</div>

<!--
    Visualización educativa conceptual, táctil y sin dependencias externas.

    La escala vertical representa la emergencia y ampliación del significado: realidad física,
    vida, experiencia, valor, propósito, significado compartido y responsabilidad cósmica.
    No afirma que el universo posea un propósito secreto ni que la ausencia de una finalidad física
    vuelva irreales los valores construidos por seres conscientes.

    La dimensión horizontal contrasta interpretaciones y prioridades: significado intrínseco o
    construido, propósito personal o colectivo, supervivencia o florecimiento, descubrimiento o
    preservación, valores biológicos o artificiales y certeza o compromiso bajo incertidumbre.

    Las escenas enseñan que la realidad establece condiciones; la vida genera necesidades; la
    conciencia crea experiencia; las mentes forman valores; los valores orientan acciones; y las
    acciones construyen mundos cuyas consecuencias pueden ser mejores o peores para quienes los viven.
  -->
