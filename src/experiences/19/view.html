<canvas
  id="technology-spectrum"
  tabindex="0"
  role="application"
  aria-label="Exploración táctil de la tecnología, desde la civilización planetaria en la parte inferior hasta los futuros tecnológicos en la parte superior. Toca, arrastra o usa las flechas del teclado."
></canvas>
<div id="top-bloom" aria-hidden="true"></div>
<div id="bottom-glow" aria-hidden="true"></div>
<div id="light-field" aria-hidden="true"></div>
<div id="scan-line" aria-hidden="true"></div>
<div id="grain" aria-hidden="true"></div>
<div id="vignette" aria-hidden="true"></div>
<div id="hint" aria-hidden="true">
  <strong>Toca y asciende</strong> · de la civilización a la autonomía
</div>
<div id="readout" aria-live="polite" aria-atomic="true">
  <span id="evidence-class" data-narration-role="shared-context"></span
  ><strong id="zone-name" data-narration-role="region-heading"></strong
  ><span id="feature-name" data-narration-role="item"></span
  ><span id="metric" data-narration-role="shared-context"></span
  ><span id="fact" data-narration-role="explanation"></span>
</div>
<div id="touch-orb" aria-hidden="true"></div>
<div id="journey-scale" aria-hidden="true">
  <span id="scale-top">Futuros tecnológicos</span>
  <div id="scale-track"><div id="scale-fill"></div></div>
  <div id="scale-dot"></div>
  <span id="scale-value">Civilización planetaria</span
  ><span id="scale-bottom">Civilización planetaria</span>
</div>

<!--
    Visualización educativa conceptual, táctil y sin dependencias externas.

    La escala vertical representa capas de capacidad técnica, coordinación y autonomía; no una cronología
    universal ni una escalera inevitable de progreso. Herramientas antiguas y sistemas recientes coexisten,
    las trayectorias históricas fueron diversas y toda tecnología depende de personas, materiales, energía,
    mantenimiento, instituciones y decisiones políticas.

    El recorrido distingue capacidad técnica, viabilidad, distribución de beneficios, legitimidad y riesgo.
    No afirma que la automatización elimine la responsabilidad humana, que la inteligencia artificial posea
    conciencia o juicio fiable, que la innovación sea neutral ni que una civilización conectada controle los
    sistemas que construye. Las imágenes son metáforas interactivas, no reconstrucciones históricas literales.
  -->
